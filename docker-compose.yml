services:
  dev-workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Монтируем корень проекта в стандартный путь воркспейса
      - .:/workspaces/red-planner:cached
      # Прокидываем сокет для Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
    # Чтобы контейнер не выключился сразу
    command: sleep infinity

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: red_planner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
